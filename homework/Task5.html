<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            width: 300px;
            height: 200px;
            background-color: #ccc;
            position: relative;
            overflow: hidden;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
        }
        .round1,.round2 {
            width: 100px;
            height: 100px;
            background-color: #fc0;
            border-radius: 50%;
            position: absolute;
        }
        .round1 {
            top: -50px;
            left: -50px;
        }
        .round2 {
            bottom: -50px;
            right: -50px;
        }
    </style>
</head>
<body>
   <div class="box">
    <div class="round1"></div>
    <div class="round2"></div>
   </div> 
</body>
</html>
